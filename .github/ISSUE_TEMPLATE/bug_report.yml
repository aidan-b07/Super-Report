name: Bug report
description: Something in Super-Report isn't working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the [open issues](https://github.com/aidan-b07/Super-Report/issues) first in case it's already been reported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps that cause the bug, as exactly as you can.
      placeholder: |
        1. Run /report Steve
        2. Click the Hacking reason
        3. ...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Super-Report version
      description: Shown by `/version SuperReport`.
      placeholder: "2.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server software and version
      description: Shown by `/version`.
      placeholder: "Paper 1.21.11"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (the default)
        - MySQL, one server
        - MySQL, shared between several servers
    validations:
      required: true

  - type: dropdown
    id: discord
    attributes:
      label: Is the Discord bot turned on?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Errors in the console
      description: Paste any errors or stack traces from the console or `logs/latest.log`. Remove anything private, like your bot token or database password, first.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: If the bug involves your settings, paste the relevant part of `config.yml`, `Messages.yml` or a menu file. Remove your bot token and database password first.
      render: yaml

  - type: textarea
    id: other-plugins
    attributes:
      label: Other plugins
      description: Plugins you think might be involved, e.g. other chat, punishment or menu plugins.
