name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # server.skip leaves out the local test server step, which isn't wanted here
      - name: Build and test
        run: mvn -B package -Dserver.skip=true

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: SuperReport
          path: target/SuperReport.jar
