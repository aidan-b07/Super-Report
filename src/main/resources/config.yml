#MYSQL DATABASE
MySQL:
  MySqlEnabled: false
  host: localhost
  port: 3306
  database: superreport
  username: root
  password: password

DebugMode: false

#####~~REPORT MENU~~#####
ReportMenu:
  #Set Size of menu - VERY IMPORTANT NOTE: MUST BE A MULTIPLE OF 9 ie. 27, 36
  Size: 36
  #Set name of menu (the text at the top)
  Name: "Report Menu"
  #Items of the menu
  Items:
    Slot:

    Fill:
      Material: "gray_stained_glass_pane"
      Name: ""

#####~~DISCORD BOT~~#####
# Every text setting below can use the placeholders listed for its message.
# Anything set to "none" (or left empty) is left out of the embed.
DiscordBot:
  Enabled: false
  Token: "TOKENHERE"
  # Shown in each embed's footer as {server}
  ServerName: "Minecraft Server"

  # Placeholders: {reported.name} {reported.uuid} {reported.head} {reported.ip}
  #               {reporter.name} {reporter.uuid} {reporter.head} {reporter.ip}
  #               {reason} {report.id} {server}
  ReportMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      # Sent above the embed. To ping a role use "<@&ROLE_ID>", e.g. "<@&123456789012345678>"
      Message: ""
      Color: "F1C40F"
      Author: "New Report"
      AuthorIcon: "{reporter.head}"
      Title: "{reported.name} has been reported"
      Thumbnail: "{reported.head}"
      Description:
        - "A player has sent a report. Review it in-game with `/reports`."
      Fields:
        - Name: "Reported Player"
          Value: "{reported.name}"
          Inline: true
        - Name: "Reported By"
          Value: "{reporter.name}"
          Inline: true
        - Name: "Report ID"
          Value: "`#{report.id}`"
          Inline: true
        - Name: "Reason"
          Value: "{reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true

  # Placeholders: {banned.name} {banned.uuid} {banned.head} {banned.ip}
  #               {punisher.name} {punisher.uuid} {punisher.head} {punisher.ip}
  #               {ban.reason} {ban.duration} {ban.expires} {server}
  BanMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      Message: ""
      Color: "E74C3C"
      Author: "Banned by {punisher.name}"
      AuthorIcon: "{punisher.head}"
      Title: "{banned.name} has been banned"
      Thumbnail: "{banned.head}"
      Fields:
        - Name: "Player"
          Value: "{banned.name}"
          Inline: true
        - Name: "Duration"
          Value: "{ban.duration}"
          Inline: true
        - Name: "Expires"
          Value: "{ban.expires}"
          Inline: true
        - Name: "Reason"
          Value: "{ban.reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true

  # Placeholders: {muted.name} {muted.uuid} {muted.head} {muted.ip}
  #               {punisher.name} {punisher.uuid} {punisher.head} {punisher.ip}
  #               {mute.reason} {mute.duration} {mute.expires} {server}
  MuteMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      Message: ""
      Color: "E67E22"
      Author: "Muted by {punisher.name}"
      AuthorIcon: "{punisher.head}"
      Title: "{muted.name} has been muted"
      Thumbnail: "{muted.head}"
      Fields:
        - Name: "Player"
          Value: "{muted.name}"
          Inline: true
        - Name: "Duration"
          Value: "{mute.duration}"
          Inline: true
        - Name: "Expires"
          Value: "{mute.expires}"
          Inline: true
        - Name: "Reason"
          Value: "{mute.reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true
