#########################################################
#                     Super-Report                      #
#  For information and support join the discord server  #
#             @https://discord.gg/3wqbfmX74P            #
#########################################################

#MYSQL DATABASE
MySQL:
  MySqlEnabled: false
  host: localhost
  port: 3306
  database: superreport
  username: root
  password: password

# This server's name. Tells servers apart when they share a MySQL database, and shows in Discord embeds as {server}
ServerName: "Minecraft Server"

# Checks GitHub for a new release on startup and twice a day. Admins with superreport.updates are told when they join
CheckForUpdates: true

#####~~DISCORD BOT~~#####
# Every text setting below can use the placeholders listed for its message.
# Anything set to "none" (or left empty) is left out of the embed.
DiscordBot:
  Enabled: false
  Token: "TOKENHERE"

  # Placeholders: {reported.name} {reported.uuid} {reported.head} {reported.ip}
  #               {reporter.name} {reporter.uuid} {reporter.head} {reporter.ip}
  #               {reason} {report.id} {server}
  ReportMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      # Sent above the embed. To ping a role use "<@&ROLE_ID>", e.g. "<@&123456789012345678>"
      Message: ""
      Color: "F1C40F"
      Author: "New Report"
      AuthorIcon: "{reporter.head}"
      Title: "{reported.name} has been reported"
      Thumbnail: "{reported.head}"
      Description:
        - "A player has sent a report. Review it in-game with `/reports`."
      Fields:
        - Name: "Status"
          Value: "{status}"
          Inline: false
        - Name: "Reported Player"
          Value: "{reported.name}"
          Inline: true
        - Name: "Reported By"
          Value: "{reporter.name}"
          Inline: true
        - Name: "Report ID"
          Value: "`#{report.id}`"
          Inline: true
        - Name: "Reason"
          Value: "{reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true

  # Placeholders: {banned.name} {banned.uuid} {banned.head} {banned.ip}
  #               {punisher.name} {punisher.uuid} {punisher.head} {punisher.ip}
  #               {ban.reason} {ban.duration} {ban.expires} {server}
  BanMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      Message: ""
      Color: "E74C3C"
      Author: "Banned by {punisher.name}"
      AuthorIcon: "{punisher.head}"
      Title: "{banned.name} has been banned"
      Thumbnail: "{banned.head}"
      Fields:
        - Name: "Status"
          Value: "{status}"
          Inline: false
        - Name: "Player"
          Value: "{banned.name}"
          Inline: true
        - Name: "Duration"
          Value: "{ban.duration}"
          Inline: true
        - Name: "Expires"
          Value: "{ban.expires}"
          Inline: true
        - Name: "Reason"
          Value: "{ban.reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true

  # Placeholders: {muted.name} {muted.uuid} {muted.head} {muted.ip}
  #               {punisher.name} {punisher.uuid} {punisher.head} {punisher.ip}
  #               {mute.reason} {mute.duration} {mute.expires} {server}
  MuteMessage:
    ChannelID: "CHANNELIDHERE"
    Layout:
      Message: ""
      Color: "E67E22"
      Author: "Muted by {punisher.name}"
      AuthorIcon: "{punisher.head}"
      Title: "{muted.name} has been muted"
      Thumbnail: "{muted.head}"
      Fields:
        - Name: "Status"
          Value: "{status}"
          Inline: false
        - Name: "Player"
          Value: "{muted.name}"
          Inline: true
        - Name: "Duration"
          Value: "{mute.duration}"
          Inline: true
        - Name: "Expires"
          Value: "{mute.expires}"
          Inline: true
        - Name: "Reason"
          Value: "{mute.reason}"
          Inline: false
      Footer: "{server} | Super-Report"
      Timestamp: true

  # The {status} box at the top of each embed, which is updated as things change.
  # Text in `backticks` shows as a rounded box on Discord. Once a report or punishment is over its embed
  # is also recoloured with Color. {time} is when it changed, shown as e.g. "2 minutes ago"
  Status:
    Color: "95A5A6"
    Open: "`OPEN`"
    # {resolver.name}, {outcome} (e.g. "Banned for 3 days")
    Punished: "`RESOLVED` by {resolver.name} {time}\n{outcome}"
    Dismissed: "`DISMISSED` by {resolver.name} {time}"
    Banned: "`BANNED`"
    Muted: "`MUTED`"
    # {lifter.name}
    Lifted: "`LIFTED` by {lifter.name} {time}"
    Expired: "`EXPIRED` {time}"
