name: SuperReport
author: Superbility
version: ${project.version}
main: dev.aidanbooth.superreport.Main
description: Player reports, bans and mutes through menus, with a Discord log for staff
# Tells 1.13+ servers the plugin uses the modern material names (XMaterial handles older versions), so they skip legacy mode. Older servers ignore it
api-version: '1.13'
commands:
  report:
    description: Report a player to staff
    usage: /<command> <player> [reason]
    permission: superreport.report
  reports:
    description: Review open reports
    permission: superreport.reports
  unban:
    description: Lift a player's ban
    usage: /<command> <player>
    permission: superreport.unban
  unmute:
    description: Lift a player's mute
    usage: /<command> <player>
    permission: superreport.unmute
  punish:
    description: Ban or mute a player through the punish menus
    usage: /<command> <player>
    aliases:
      - ban
      - mute
      - tempban
      - tempmute
    permission: superreport.punish
permissions:
  superreport.report:
    description: Allows use of the '/report' command. Typically used by players
    default: true
  superreport.reports:
    description: Allows use of the '/reports' command. Typically used by mods / admins
    default: op
  superreport.unban:
    description: Allows use of the '/unban' command. Typically used by admins
    default: op
  superreport.unmute:
    description: Allows use of the '/unmute' command. Typically used by admins
    default: op
  superreport.punish:
    description: Allows use of the '/punish' command. Typically used by admins
    default: op
  superreport.notifications:
    description: Tells the player when a report is submitted, and how many are open when they join. Typically used by mods / admins
    default: op
  superreport.mutebypass:
    description: Prevents users with this permission from being muted. Typically used by staff
    default: false
  superreport.banbypass:
    description: Prevents users with this permission from being banned. Typically used by staff
    default: false
  superreport.updates:
    description: Tells the player when a new version of Super-Report is out. Typically used by admins
    default: op
